# Named-PCM config so modem73's miniaudio ALSA backend can select the individual
# 4-card ALSA loopback endpoints. miniaudio's ALSA enumeration is name-hint based
# and modem73 selects devices by enumeration INDEX, so the adapter launches
# `modem73 --list-audio` under this config, finds these hint names, and passes the
# resolved indices via --input-device/--output-device. Point modem73 at this file
# via ALSA_CONFIG_PATH (and defeat the PulseAudio backend with a bogus
# PULSE_SERVER so miniaudio falls back to ALSA -- Pulse cannot see the raw
# snd-aloop cards on a bench that keeps them out of PipeWire).
#
# `type plug` adapts rate/format/channels at the miniaudio boundary. The cable
# runs at 48 kHz and modem73's miniaudio opens at 48 kHz, so the plug does no
# rate conversion. The endpoints map onto the same card/dev points the ALSA
# transport captures and plays, so modem73 shares the rig with the other modems:
#   M73_TXA = card2 dev1   M73_RXA = card3 dev1
#   M73_TXB = card4 dev0   M73_RXB = card5 dev0
#   (cards: Loopback=2  Loopback1=3  Loopback2=4  Loopback3=5)
</usr/share/alsa/alsa.conf>

pcm."M73_TXA" { type plug  slave.pcm "hw:Loopback,1"   hint.description "M73_TXA" }
pcm."M73_RXA" { type plug  slave.pcm "hw:Loopback1,1"  hint.description "M73_RXA" }
pcm."M73_TXB" { type plug  slave.pcm "hw:Loopback2,0"  hint.description "M73_TXB" }
pcm."M73_RXB" { type plug  slave.pcm "hw:Loopback3,0"  hint.description "M73_RXB" }
